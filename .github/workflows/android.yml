name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Setup Environment and Keystore Files
        run: |
          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
          fi

          # Ensure debug.keystore exists (restore from base64 or generate)
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug.keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Direct APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Masjid-AtTaqwa-Penancangan.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Masjid-AtTaqwa-Penancangan-APK
          path: app/build/outputs/apk/debug/Masjid-AtTaqwa-Penancangan.apk
          retention-days: 14

      - name: Publish Direct Download APK via GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest-build
          name: "Masjid Jami' At-Taqwa Penancangan (APK Siap Pasang)"
          body: |
            ### 🕌 Download Langsung File APK (Android)
            Unduh file **`Masjid-AtTaqwa-Penancangan.apk`** langsung dari tautan Assets di bawah ini. Tidak perlu ekstrak file zip!

            - **Fitur Utama:**
              - Jadwal Shalat Kemenag RI (Penancangan - Serang)
              - Jadwal Petugas Shalat 5 Waktu, Jum'at & Hari Raya
              - Jam Digital & Hitung Mundur Iqomah
              - Running Text Pengumuman Marquee
              - Mode TV Digital Signage Layar Lebar
              - Transparansi Kas & Donasi Digital QRIS
          files: app/build/outputs/apk/debug/Masjid-AtTaqwa-Penancangan.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
